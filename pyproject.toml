[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revemap"
version = "0.1.0"
description = "Multi-view verified instance recovery for RGB-D semantic mapping"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "Pillow>=10",
    "plyfile>=1.0",
    "opencv-python-headless>=4.8,<5",
    "PyYAML>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2"]
geometry = ["open3d>=0.19,<0.20"]
visualization = ["matplotlib>=3.8"]

[project.scripts]
revemap = "revemap.cli:main"
revemap-gui = "pose_pipeline.live_gui:main"

[project.urls]
Repository = "https://github.com/Aidenwu0209/ReVeMap"
Issues = "https://github.com/Aidenwu0209/ReVeMap/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["revemap*", "pose_pipeline*", "reconstruction*"]

[tool.setuptools.package-data]
revemap = ["resources/*.json"]
pose_pipeline = ["live_gui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
