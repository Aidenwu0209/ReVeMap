name: CPU regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test native viewer bridge
        run: node --test tests/js/*.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run regression tests
        run: python -m pytest -q
      - name: Check public entry points
        run: |
          revemap --help
          revemap --version
          revemap list-vlm-models
          revemap gui --help
          revemap clean-pointcloud --help
          revemap evaluate-semantic --help
          revemap build-scene-graph --help
      - name: Build package
        run: python -m build
      - name: Install and exercise wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/revemap-wheel-env"
          "$RUNNER_TEMP/revemap-wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          CLI="$RUNNER_TEMP/revemap-wheel-env/bin/revemap"
          "$CLI" --version
          "$CLI" list-vlm-models
          "$CLI" gui --help
          "$CLI" clean-pointcloud --help
          "$CLI" evaluate-semantic --help
          "$CLI" demo --output "$RUNNER_TEMP/revemap-demo"
          "$CLI" query-scene --graph "$RUNNER_TEMP/revemap-demo/scene_graph.json" --label chair
          "$CLI" query-scene --graph "$RUNNER_TEMP/revemap-demo/scene_graph.json" --question '有几把椅子'
          "$RUNNER_TEMP/revemap-wheel-env/bin/python" -c 'from importlib.resources import files; from pose_pipeline import device_gui, device_capture, ipad_protocol; assert all(files("pose_pipeline").joinpath(p).is_file() for p in ("live_gui.html", "device_gui.html", "scene_query_ui.js", "surface_viewer.js"))'
