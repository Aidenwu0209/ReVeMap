name: CPU regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run regression tests
        run: python -m pytest -q
      - name: Check public entry points
        run: |
          revemap --help
          revemap --version
          revemap list-vlm-models
          revemap gui --help
      - name: Build package
        run: python -m build
